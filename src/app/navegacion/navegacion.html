<header class="cabecera-madera textura-madera">
  <div class="contenedor-madera container">

    <a class="marca-madera d-flex align-items-center gap-2" routerLink="/" (click)="cerrarMenu()">
      <img src="img/manila_icon_filipino_v2.png" alt="" class="brand-mark">
      <span class="brand-lockup">
        <span class="brand-viking-word">MANILA</span>
        <span class="brand-viking-sub">Restaurante</span>
      </span>
    </a>

    <button
      class="toggle-madera"
      type="button"
      (click)="alternarMenu()"
      [attr.aria-expanded]="menuAbierto()"
      aria-label="Abrir navegación"
    >
      <span></span><span></span><span></span>
    </button>

    <nav class="viga-carteles" [class.abierto]="menuAbierto()">

      @for (cartel of carteles; track cartel.id) {
        <span class="percha">
          <span class="cadena-eslabones" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>

          <a
            class="tablon-colgante tablon-nav"
            [routerLink]="cartel.ruta"
            routerLinkActive="activo"
            [routerLinkActiveOptions]="{ exact: !!cartel.exact }"
            (click)="cerrarMenu()"
          >
            <span class="texto-quemado">{{ cartel.label }}</span>
          </a>
        </span>
      }

      <span class="percha">
        <span class="cadena-eslabones" aria-hidden="true">
          <span></span><span></span><span></span>
        </span>

        <a class="tablon-colgante tablon-nav tablon-pedido" routerLink="/pedido" routerLinkActive="activo" (click)="cerrarMenu()">
          <span class="texto-quemado">
            <i class="bi bi-cart3 me-1"></i>
            Pedido
          </span>

          @if (carritoService.totalItems() > 0) {
            <span class="contador-brasa ms-1">{{ carritoService.totalItems() }}</span>
          }
        </a>
      </span>

    </nav>

  </div>
</header>
